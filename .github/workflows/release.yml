name: Release

# 릴리스 흐름
#   package.json 의 version 을 올리고 v<version> 태그를 push 하면 실행된다.
#   macOS(서명 + Apple 공증, 유니버설) · Windows(서명 없음) 설치 파일을 Tauri 로 만들어
#   초안(draft) 릴리스 v<version> 에 올린다. GitHub 에서 "Publish release" 를 눌러야 공개된다.
#   자동 업데이트: 업데이트 파일(.app.tar.gz · setup.exe)과 latest.json 도 같이 올린다.
#   앱은 releases/latest/download/latest.json 을 보므로, 공개(Publish)해야 사용자에게 간다.
#
# 서명 인증서·공증 키는 macOS 빌드 단계에만 넘긴다.
# 로컬 `npm run build` 는 임시(ad-hoc) 서명으로 만든다 (tauri.conf.json 의 signingIdentity "-").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 자동 업데이트 파일(.sig) 서명 키. 공개 키는 tauri.conf.json 의 plugins.updater.pubkey
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER: '{"bundle":{"createUpdaterArtifacts":true}}'
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: 업데이트 서명 키 확인
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY Secret 이 없습니다"; exit 1; fi
      - name: 설치 파일 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx tauri build --bundles nsis --config "$UPDATER"
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/poketmon-idle-${{ steps.v.outputs.version }}-win-setup.exe"
          cp src-tauri/target/release/bundle/nsis/*.exe.sig "out/poketmon-idle-${{ steps.v.outputs.version }}-win-setup.exe.sig"
      - name: 설치 파일 (macOS, 서명 + 공증)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::macOS 서명용 Secrets 가 없습니다"; exit 1
          fi
          # 인증서는 직접 만든 임시 키체인에 넣는다
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" # Tauri 는 공증 키를 파일 경로로 받는다
          trap 'security delete-keychain "$keychain" 2>/dev/null; rm -f "$RUNNER_TEMP/cert.p12" "$APPLE_API_KEY_PATH"' EXIT
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # 설정 파일의 임시 서명("-") 대신 가져온 Developer ID 로 서명하고, 위 API 키로 공증한다
          export APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "::error::Developer ID 인증서를 찾지 못했습니다"; exit 1; fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$UPDATER"
          mkdir -p out
          b=src-tauri/target/universal-apple-darwin/release/bundle
          cp $b/dmg/*.dmg "out/poketmon-idle-${{ steps.v.outputs.version }}-mac-universal.dmg"
          cp $b/macos/*.app.tar.gz "out/poketmon-idle-${{ steps.v.outputs.version }}-mac-universal.app.tar.gz"
          cp $b/macos/*.app.tar.gz.sig "out/poketmon-idle-${{ steps.v.outputs.version }}-mac-universal.app.tar.gz.sig"
      - name: 서명·공증 확인 (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 자동 업데이트용 latest.json
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          base="https://github.com/$REPO/releases/download/v$VERSION"
          mac="poketmon-idle-$VERSION-mac-universal.app.tar.gz"
          win="poketmon-idle-$VERSION-win-setup.exe"
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$REPO/releases/tag/v$VERSION" \
            --arg mac_url "$base/$mac" --arg mac_sig "$(cat "$mac.sig")" \
            --arg win_url "$base/$win" --arg win_sig "$(cat "$win.sig")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
              "windows-x86_64": {url: $win_url, signature: $win_sig}}}' > latest.json
          rm -f -- *.sig # 서명은 latest.json 안에 들어갔다
          cat latest.json
      - name: 체크섬
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: 초안 릴리스 v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "::error::v$VERSION 은 이미 공개됐습니다. package.json 의 version 을 먼저 올리세요"; exit 1
          fi
          # 같은 버전의 이전 초안은 옛 커밋을 가리키므로 다시 만든다
          if [ "$state" = "true" ]; then gh release delete "v$VERSION" --yes; fi
          cat > notes.md <<'NOTES'
          ### 설치
          - **macOS**: `poketmon-idle-x.y.z-mac-universal.dmg` 를 열어 앱을 응용 프로그램 폴더로 옮기면 바로 실행된다 (Apple 서명·공증).
          - **Windows**: `poketmon-idle-x.y.z-win-setup.exe` 실행. SmartScreen 이 막으면 **추가 정보 → 실행**.

          NOTES
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes dist/*
