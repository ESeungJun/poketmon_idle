name: Release

# 릴리스 흐름
#   package.json 의 version 을 올리고 v<version> 태그를 push 하면 실행된다.
#   macOS(서명 + Apple 공증) · Windows(서명 없음) 설치 파일을 만들어
#   초안(draft) 릴리스 v<version> 에 올린다. GitHub 에서 "Publish release" 를 눌러야 공개된다.
#
# 빌드 작업은 의존성 설치 스크립트 없이 설치하고(--ignore-scripts, Electron 은
# electron-builder 가 직접 받는다), 서명 인증서·공증 키는 macOS 패키징 단계에만 넘긴다.
# 로컬 `npm run build` 는 그대로 임시 서명 + scripts/fix-app-bundle.js 를 쓴다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - name: 설치 파일 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.artifactName='poketmon-idle-${version}-win-setup.${ext}'
      - name: 설치 파일 (macOS, 서명 + 공증)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::macOS 서명용 Secrets 가 없습니다"; exit 1
          fi
          # 인증서는 직접 만든 임시 키체인에 넣는다 (electron-builder 가 CSC_LINK 로 만드는
          # 키체인은 macOS 26 러너에서 잠금 해제가 안 된다)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" # electron-builder 는 공증 키를 파일 경로로 받는다
          trap 'security delete-keychain "$keychain" 2>/dev/null; rm -f "$RUNNER_TEMP/cert.p12" "$APPLE_API_KEY"' EXIT
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # 공증에는 hardened runtime 이 필요하다. forceCodeSigning: 서명이 안 되면 임시 서명으로 넘어가지 않고 실패
          npx electron-builder --mac dmg zip --universal --publish never \
            -c.mac.hardenedRuntime=true \
            -c.mac.entitlements=entitlements.plist \
            -c.mac.entitlementsInherit=entitlements.plist \
            -c.mac.forceCodeSigning=true \
            -c.artifactName='poketmon-idle-${version}-mac-${arch}.${ext}'
      - name: 서명·공증 확인 (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: 초안 릴리스 v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "::error::v$VERSION 은 이미 공개됐습니다. package.json 의 version 을 먼저 올리세요"; exit 1
          fi
          # 같은 버전의 이전 초안은 옛 커밋을 가리키므로 다시 만든다
          if [ "$state" = "true" ]; then gh release delete "v$VERSION" --yes; fi
          cat > notes.md <<'NOTES'
          ### 설치
          - **macOS**: `poketmon-idle-x.y.z-mac-universal.dmg` 를 열어 앱을 응용 프로그램 폴더로 옮기면 바로 실행된다 (Apple 서명·공증).
          - **Windows**: `poketmon-idle-x.y.z-win-setup.exe` 실행. SmartScreen 이 막으면 **추가 정보 → 실행**.

          NOTES
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes dist/*
